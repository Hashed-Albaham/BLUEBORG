name: Deploy BTUC CMS to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "btuc-cms-prototype/**"
      - ".github/workflows/deploy-cms-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: btuc-cms-prototype/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: btuc-cms-prototype
        run: pnpm install --frozen-lockfile
      - name: Run tests and typecheck
        working-directory: btuc-cms-prototype
        run: pnpm test && pnpm check
      - name: Build GitHub Pages site
        working-directory: btuc-cms-prototype
        env:
          VITE_BASE_PATH: /BLUEBORG/
        run: pnpm build:client
      - name: Add SPA fallback
        run: cp btuc-cms-prototype/dist/public/index.html btuc-cms-prototype/dist/public/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: btuc-cms-prototype/dist/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
